<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes de mascotas — PataConecta</title>
    <link rel="stylesheet" href="css1/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>
    <header id="menu-principal"></header>

    <main>
        <section class="encabezado-pagina">
            <h1>Reportes de Mascotas</h1>
            <p>Mascotas perdidas en Kennedy. ¿Encontraste una? Pulsa <strong>“Mascota encontrada”</strong> en su tarjeta y escribe el código de su collar para ver el contacto del dueño.</p>
        </section>

        <section class="filtros">
            <select id="filtro-tipo" aria-label="Filtrar por estado">
                <option value="todos">Todos los reportes</option>
                <option value="perdida">Aún perdidas</option>
                <option value="encontrada">Ya encontradas</option>
            </select>

            <select id="filtro-sector">
                <option value="todos">Todos los sectores</option>
                <option value="kennedy-central">Kennedy Central</option>
                <option value="patio-bonito">Patio Bonito</option>
                <option value="corabastos">Corabastos</option>
                <option value="timiza">Timiza</option>
                <option value="castilla">Castilla</option>
                <option value="tintal">Tintal</option>
                <option value="britalia">Britalia</option>
            </select>
        </section>

        <section class="mapa-container">
            <div id="mapa"></div>
        </section>

        <section class="lista-reportes" id="lista-reportes">

        </section>
    </main>

    <footer>
        <p>&copy; 2026 PataConecta. Proyecto académico, Kennedy, Bogotá. Todos los derechos reservados.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="js1/firebase-config.js"></script>
    <script src="js1/menu.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js1/app.js"></script>
</body>
</html>
