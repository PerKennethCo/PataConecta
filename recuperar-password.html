<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña — PataConecta</title>
    <link rel="stylesheet" href="css1/style.css">
</head>
<body>
    <header>
        <div class="logo">🐾 PataConecta</div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="login.html" id="nav-auth-link">Iniciar sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="encabezado-pagina">
            <h1>Recuperar contraseña</h1>
            <p>Verifica tu identidad con los datos que registraste para poder establecer una nueva contraseña.</p>
        </section>

        <section class="formulario-container">
            <form id="form-recuperar-password">
                <label for="rec-correo">Correo</label>
                <input type="email" id="rec-correo" required>

                <label for="rec-documento">Número de documento</label>
                <input type="text" id="rec-documento" required>

                <label for="rec-telefono">Teléfono</label>
                <input type="tel" id="rec-telefono" required>

                <label for="rec-pin">PIN de seguridad (2 dígitos)</label>
                <input type="text" id="rec-pin" pattern="\d{2}" maxlength="2" required>

                <label for="rec-password-nueva">Nueva contraseña</label>
                <input type="password" id="rec-password-nueva" minlength="6" required>

                <button type="submit">Restablecer contraseña</button>
            </form>
            <p id="rec-mensaje" style="margin-top:12px;"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 PataConecta. Proyecto académico, Kennedy, Bogotá. Todos los derechos reservados.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js1/firebase-config.js"></script>
    <script src="js1/app.js"></script>
</body>
</html>
